
<h2>EMP DTL</h2>
<p>This is The Employee Management System</p>

<button class="btn btn-danger" (click)="logout()">
  Logout
</button>

<label>Name</label>
<input type="text" class="form-control" [(ngModel)]="employee.name" placeholder="Enter The Name" >
<label>
    Email
</label>
<input type="text" class="form-control" [(ngModel)]="employee.email" placeholder="Enter Email" >
<label>Phone</label>
<input type="text" class="form-control" [(ngModel)]="employee.phone" placeholder="Enter Phone">
<label>Department</label>
<input type="text" class="form-control" [(ngModel)]="employee.department" placeholder="Enter Department">
<label>Designation</label>
<input type="text" class="form-control" [(ngModel)]="employee.designation" placeholder="Enter Designation">
<label>Salary</label>
<input type="text" class="form-control" [(ngModel)]="employee.salary" placeholder="Enter Salary">


<div *ngIf="!isEdit">
    
<label>ManagerId</label>
<input type="text" class="form-control" [(ngModel)]="employee.managerId" placeholder="Enter ManagerId">

</div>

<label class="form-label">Resume</label>

  <input
    type="file"
    class="form-control"
    accept=".pdf,.doc,.docx"
    (change)="onResumeSelected($event)">

<button class="btn btn-primary" 
        (click)="saveemployee()">
         {{ isEdit ? 'Update Employee' : 'Add Employee' }}

</button>

<table class="table table-bordered table-striped mt-5">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Salary</th>
                <th>Department</th>
                <th>Designation</th>
                <th>ManagerId</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let emploop of employees">
                <td>{{emploop.id}}</td>
                <td>{{emploop.name}}</td>
                <td>{{emploop.email}}</td>
                <td>{{emploop.salary}}</td>
                <td>{{emploop.department}}</td>
                <td>{{emploop.designation}}</td>
                <td>{{emploop.managerId}}</td>


                <td>
                    <button class=" btn btn-primary btn-sm me-2"
                    (click)="downloderesume(emploop)">
                        Downlode Resume
                    </button>
                    <button class="btn btn-warning btn-sm me-2"
                    (click)="editemployee(emploop)">
                        Edit
                    </button>
                    <button class="btn btn-danger btn-sm"
                    (click)="deleteemployee(emploop.id!)">
                        Delete
                    </button>
                </td>

            </tr>
        </tbody>
